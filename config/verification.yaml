schema_version: '1.1'
# Approved #589 partial milestone. Only NEW observations in future Pacific slots
# may record a handled limitation; no old record is reinterpreted or migrated.
access_failures:
  effective_from: '2026-10-27'
  disposition: retain_verified
calendar: config/calendar/elections.yaml
elections:
- election_id: wa-2026-general
  registry: config/sources/wa-2026-general.yaml
  inventory: data/normalized/wa-2026-general-inventory.json
  sources:
  - source_id: transit-riders-union
    adapter: config/adapters/wa-2026-general/transit-riders-union.yaml
    limitation: Complete official WordPress archives to the reviewed September boundary, both known
      and newly learned current-general articles, and the exact linked October graphic are captured.
      Learned article obligations survive failed checks and link rotation. Only twelve reviewed formal
      facts are mapped from the designated October article; qualified recommendations stay held.
      Full HTML/image changes require review. The expanded composite requires its own exact live
      baseline approval and later independent native scheduled reuse; neither is asserted here.
      Prior failures and the unresolved exact October 20 baseline remain intact. See
      docs/GENERAL_RECHECK_2026-10-21_TRU.md.
  - source_id: sage-leaders
    adapter: config/adapters/wa-2026-general/sage-leaders.yaml
    limitation: Conservative reviewed fact mappings; every changed publication requires human review.
      Exact live baseline approved October 18; see docs/GENERAL_BASELINES_2026-10-18.md.
  - source_id: seiu-775
    adapter: config/adapters/wa-2026-general/seiu-775.yaml
    limitation: Conservative reviewed fact mappings; every changed publication requires human review.
      Exact live baseline approved October 18; see docs/GENERAL_BASELINES_2026-10-18.md.
  - source_id: ufcw-3000
    adapter: config/adapters/wa-2026-general/ufcw-3000.yaml
    limitation: Conservative reviewed fact mappings; complete landing page and relevant official articles
      require human review. The expanded composite needs exact baseline review; the October 18 approval
      covers the earlier landing page. Independent scheduled reuse remains adoption work.
  - source_id: washington-working-families-party
    adapter: config/adapters/wa-2026-general/washington-working-families-party.yaml
    request:
      url: https://workingfamilies.org/wp-admin/admin-ajax.php
      method: POST
      form:
        action: more_candidates
        state: '25'
        count: '0'
    limitation: Complete public Washington response covers all ten existing approved decisions;
      seven reviewed rows are outside the frozen inventory. Every changed response requires review.
      The exact complete October 20 response received a delegated baseline review;
      see docs/GENERAL_BASELINE_2026-10-20_WFP.md. Independent native scheduled reuse succeeded October 21;
      see docs/GENERAL_BASELINE_REUSE_2026-10-21_WFP.md. Other source adoption remains incomplete;
      October 18 approval covers only the historical initial page.
  - source_id: seattle-gay-news
    adapter: config/adapters/wa-2026-general/seattle-gay-news.yaml
    limitation: Conservative reviewed fact mappings; every changed publication requires human review.
      Exact live baseline approved October 18; see docs/GENERAL_BASELINES_2026-10-18.md.
    daily_from_collection: true
    index_url: https://www.sgn.org/ch/News/Seattle
    article_pattern: /story/[0-9]+/News/Seattle/SGN\s+Endorsements
    index_boundary: https://www.sgn.org/story/168513/
