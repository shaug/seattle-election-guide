notes:
  - Version 1 freezes the primary panel as a constrained carry-forward for the 2026 general election; no source or category membership, panel role, eligibility, transport code, reporting placement, selection category, publisher relationship, or overlap metadata changed.
  - The repository records the actual late freeze time rather than backdating the missed planning milestone.
  - Every consensus and comparison source was rechecked through 2026-10-03T04:09:18Z; published records require an official current-cycle or general-election publication, while primary-only or absent material is recorded as not found and inaccessible material is explicit.
  - The October prepublication refresh found new or changed official publications for 21 sources in 22 captures; each source was captured for source-by-source transcription review.
  - Publication content established only whether an official guide or endorsement page exists. Endorsement choices and observed consensus did not influence panel membership or classification.
  - The primary registry remains frozen separately as wa-2026-primary-default-sources-v4.
