name: CI
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Recovery only: full reviewed merged source SHA; blank uses this event SHA'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
env:
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
jobs:
  python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Capture exact source
      run: uv run election-guide release automation capture-source --source-sha "$RELEASE_SOURCE_SHA" --output-dir
        dist --base-sha "${BASE_SHA:-$(git rev-parse HEAD^1)}"
      id: source
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Check formatting
      run: uv run ruff format --check .
    - name: Lint
      run: uv run ruff check .
    - name: Type check
      run: uv run pyright
  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked Python dependencies
      run: uv sync --frozen
    - name: Capture exact source
      run: uv run election-guide release automation capture-source --source-sha "$RELEASE_SOURCE_SHA" --output-dir
        dist --base-sha "${BASE_SHA:-$(git rev-parse HEAD^1)}"
      id: source
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Install locked Node dependencies
      run: npm ci
    - name: Lint, type-check, and test the client modules
      run: make check-js
    - name: Verify the committed changelog matches history
      run: make check-changelog
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Capture exact source
      run: uv run election-guide release automation capture-source --source-sha "$RELEASE_SOURCE_SHA" --output-dir
        dist --base-sha "${BASE_SHA:-$(git rev-parse HEAD^1)}"
      id: source
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Validate committed election contracts
      run: make check-election-contracts
    - name: Validate the election operations calendar
      run: uv run election-guide calendar validate config/calendar/elections.yaml
    - name: Validate recurring verification policy and committed evidence
      run: uv run election-guide verification validate config/verification.yaml
    - name: Verify declared release versions are published
      run: |-
        uv run election-guide release automation resolve > dist/resolved.json
        uv run election-guide hosting verify-releases config/hosting/site.yaml --candidate-bundle-id "$(jq -r .current.bundle_id dist/resolved.json)"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify captured evidence bytes are present
      run: make check-evidence
    - name: Validate committed election results
      run: make check-results
  tests:
    name: pytest (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition:
        - unit
        - integration-comparisons
        - integration-rendering
        - integration-artifacts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Capture exact source
      run: uv run election-guide release automation capture-source --source-sha "$RELEASE_SOURCE_SHA" --output-dir
        dist --base-sha "${BASE_SHA:-$(git rev-parse HEAD^1)}"
      id: source
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Install locked Node dependencies
      run: npm ci
    - name: Check the rendering browser
      if: startsWith(matrix.partition, 'integration-')
      run: google-chrome --version
    - name: Run partition
      run: make test-${{ matrix.partition }}
  publication:
    name: Publication build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Capture exact source
      run: uv run election-guide release automation capture-source --source-sha "$RELEASE_SOURCE_SHA" --output-dir
        dist --base-sha "${BASE_SHA:-$(git rev-parse HEAD^1)}"
      id: source
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Install locked Node dependencies
      run: npm ci
    - name: Check the rendering browser
      run: google-chrome --version
    - name: Validate reviewed request
      run: |-
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          uv run election-guide release automation validate-request --base-sha "$BASE_SHA" > dist/admission.json
        else
          uv run election-guide release automation admit --preflight --source-sha "$RELEASE_SOURCE_SHA" --base-sha "$BASE_SHA" > dist/admission.json
        fi
        echo "requests_release=$(jq -r .requests_release dist/admission.json)" >> "$GITHUB_OUTPUT"
      id: request
      env:
        BASE_SHA: ${{ steps.source.outputs.base_sha }}
        GH_TOKEN: ${{ github.token }}
    - name: Build and verify deterministic general release
      run: make check-release-reproducible
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Independently verify staged site
      run: uv run election-guide hosting verify config/hosting/site.yaml dist/cloudflare-site --expected-git-commit
        "$RELEASE_SOURCE_SHA"
    - name: Preserve candidate-review
      uses: actions/upload-artifact@v4
      with:
        name: candidate-review-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          dist/reproducibility-a/bundle/RELEASE_NOTES.md
          dist/reproducibility-a/bundle/validation
          dist/admission.json
        if-no-files-found: error
        retention-days: 7
      if: always()
    - name: Preserve release
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/reproducibility-a/*.zip
        if-no-files-found: error
        retention-days: 7
      id: release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    - name: Preserve site
      uses: actions/upload-artifact@v4
      with:
        name: site-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/cloudflare-site
        if-no-files-found: error
        retention-days: 7
      id: site
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    - name: Bind release artifact
      run: uv run election-guide release automation capture-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output
        dist/release-ref.json
      env:
        ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact-digest }}
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    - name: Bind site artifact
      run: uv run election-guide release automation capture-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output dist/site-ref.json
      env:
        ARTIFACT_ID: ${{ steps.site.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.site.outputs.artifact-digest }}
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    - name: Record captured candidate
      run: uv run election-guide release automation record --producer-file dist/producer.json --release-artifact-file
        dist/release-ref.json --site-artifact-file dist/site-ref.json --output dist/candidate.json
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    - name: Preserve candidate
      uses: actions/upload-artifact@v4
      with:
        name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/candidate.json
        if-no-files-found: error
        retention-days: 7
      id: candidate
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.request.outputs.requests_release
        == 'true'
    outputs:
      requests_release: ${{ steps.request.outputs.requests_release }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      base_sha: ${{ steps.source.outputs.base_sha }}
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
      candidate_digest: ${{ steps.candidate.outputs.artifact-digest }}
      release_id: ${{ steps.release.outputs.artifact-id }}
      release_digest: ${{ steps.release.outputs.artifact-digest }}
      site_id: ${{ steps.site.outputs.artifact-id }}
      site_digest: ${{ steps.site.outputs.artifact-digest }}
  check:
    name: check
    if: ${{ always() }}
    needs:
    - python
    - client
    - contracts
    - tests
    - publication
    runs-on: ubuntu-latest
    steps:
    - name: Require every CI lane to pass
      env:
        PYTHON_RESULT: ${{ needs.python.result }}
        CLIENT_RESULT: ${{ needs.client.result }}
        CONTRACTS_RESULT: ${{ needs.contracts.result }}
        TESTS_RESULT: ${{ needs.tests.result }}
        PUBLICATION_RESULT: ${{ needs.publication.result }}
      run: |
        for result in "$PYTHON_RESULT" "$CLIENT_RESULT" "$CONTRACTS_RESULT" \
            "$TESTS_RESULT" "$PUBLICATION_RESULT"; do
          test "$result" = success
        done
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
    - check
    - publication-evidence
    - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      deployments: write
    environment:
      name: production
      url: https://seattleelections.guide
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      upload_id: ${{ steps.upload.outputs.artifact-id }}
      upload_digest: ${{ steps.upload.outputs.artifact-digest }}
      state: ${{ steps.admission.outputs.state }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install pinned Wrangler
      run: npm ci --ignore-scripts
    - name: Verify Wrangler version
      run: npm run pages:version
    - name: Download captured publication
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist --output-ref dist/publication-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publish.outputs.publication_id }}
        ARTIFACT_DIGEST: ${{ needs.publish.outputs.publication_digest }}
    - name: Download canonical promotion site
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist/cloudflare-site --output-ref dist/promotion-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publish.outputs.promotion_id }}
        ARTIFACT_DIGEST: ${{ needs.publish.outputs.promotion_digest }}
    - name: Verify canonical promotion
      run: uv run election-guide hosting verify config/hosting/site.yaml dist/cloudflare-site --expected-git-commit
        "$RELEASE_SOURCE_SHA"
    - name: Require every declared release to be published
      run: uv run election-guide hosting verify-releases config/hosting/site.yaml
    - name: Final selection and switch admission
      run: uv run election-guide release automation delivery-check --publication dist/publication.json --output-dir
        dist/upload
      id: admission
      env:
        CLOUDFLARE_PAGES_ENABLED: ${{ vars.CLOUDFLARE_PAGES_ENABLED }}
    - name: Create owned production deployment
      run: uv run election-guide release automation create-deployment --publication dist/publication.json --output
        dist/upload/deployment.json
      if: steps.admission.outputs.state == 'eligible'
    - name: Deploy production site
      run: uv run election-guide release automation upload --publication dist/publication.json --deployment dist/upload/deployment.json
        --site-dir dist/cloudflare-site --output-dir dist/upload
      if: steps.admission.outputs.state == 'eligible'
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    - name: Preserve upload
      uses: actions/upload-artifact@v4
      with:
        name: upload-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/upload
        if-no-files-found: error
        retention-days: 7
      id: upload
      if: always()
  publish:
    name: Publish canonical archive
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.publication.outputs.requests_release
      == 'true'
    needs:
    - check
    - publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      publication_id: ${{ steps.publication.outputs.artifact-id }}
      publication_digest: ${{ steps.publication.outputs.artifact-digest }}
      promotion_id: ${{ steps.promotion.outputs.artifact-id }}
      promotion_digest: ${{ steps.promotion.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install locked Node dependencies
      run: npm ci
    - name: Require exact merged source and every completed lane
      run: |-
        uv run election-guide release automation admit --source-sha "$RELEASE_SOURCE_SHA" --base-sha "$BASE_SHA" > dist/admission.json
        test "$(jq -r .eligible dist/admission.json)" = true
      env:
        BASE_SHA: ${{ needs.publication.outputs.base_sha }}
    - name: Download captured candidate
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist --output-ref dist/candidate-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publication.outputs.candidate_id }}
        ARTIFACT_DIGEST: ${{ needs.publication.outputs.candidate_digest }}
    - name: Download captured release
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist/reproducibility-a --output-ref dist/release-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publication.outputs.release_id }}
        ARTIFACT_DIGEST: ${{ needs.publication.outputs.release_digest }}
    - name: Download captured site
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist/cloudflare-site --output-ref dist/site-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publication.outputs.site_id }}
        ARTIFACT_DIGEST: ${{ needs.publication.outputs.site_digest }}
    - name: Verify and publish captured archive
      run: |-
        uv run election-guide release automation resolve > dist/resolved.json
        archive="dist/reproducibility-a/$(jq -r .archive_name dist/resolved.json)"
        uv run election-guide release automation verify-candidate --record dist/candidate.json --archive "$archive" --site-dir dist/cloudflare-site
        uv run election-guide release automation publish --record dist/candidate.json --candidate-artifact-file dist/candidate-ref.json --archive "$archive" --output-dir dist/publication
    - name: Preserve promotion
      uses: actions/upload-artifact@v4
      with:
        name: promotion-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/publication/promotion-site
        if-no-files-found: error
        retention-days: 7
      id: promotion
    - name: Bind promotion artifact
      run: uv run election-guide release automation capture-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output
        dist/promotion-ref.json
      env:
        ARTIFACT_ID: ${{ steps.promotion.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.promotion.outputs.artifact-digest }}
    - name: Bind canonical publication
      run: uv run election-guide release automation bind-publication --published dist/publication/published-archive.json
        --promotion-artifact-file dist/promotion-ref.json --output dist/publication.json
    - name: Preserve publication
      uses: actions/upload-artifact@v4
      with:
        name: publication-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/publication.json
        if-no-files-found: error
        retention-days: 7
      id: publication
    - name: Preserve publication-report
      uses: actions/upload-artifact@v4
      with:
        name: publication-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          dist/publication
          dist/admission.json
        if-no-files-found: error
        retention-days: 7
      if: always()
  publication-evidence:
    name: Retain durable publication evidence
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
    - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Download captured publication
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist --output-ref dist/publication-ref.json
      env:
        ARTIFACT_ID: ${{ needs.publish.outputs.publication_id }}
        ARTIFACT_DIGEST: ${{ needs.publish.outputs.publication_digest }}
    - name: Retain publication before deployment
      run: uv run election-guide release automation retain-publication --publication dist/publication.json
    - name: Preserve publication-evidence
      uses: actions/upload-artifact@v4
      with:
        name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist
        if-no-files-found: error
        retention-days: 7
      id: evidence
      if: always()
  finalize:
    name: Verify and retain deployment evidence
    if: always() && needs.deploy.outputs.upload_id != ''
    needs:
    - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        fetch-depth: 0
    - name: Validate captured checkout before installing code
      env:
        CAPTURED_SOURCE: ${{ inputs.source_sha || github.sha }}
      run: |-
        [[ "$CAPTURED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$CAPTURED_SOURCE"
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$CAPTURED_SOURCE" origin/main
        fi
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python
      run: uv python install 3.12
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Download retained upload
      run: uv run election-guide release automation fetch-artifact --source-sha "$RELEASE_SOURCE_SHA" --artifact-id
        "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-dir
        dist/upload --output-ref dist/upload-ref.json
      env:
        ARTIFACT_ID: ${{ needs.deploy.outputs.upload_id }}
        ARTIFACT_DIGEST: ${{ needs.deploy.outputs.upload_digest }}
    - name: Finalize uploaded or skipped operation
      run: |-
        if [ -f dist/upload/operation.json ]; then
          uv run election-guide release automation retain-operation --receipt dist/upload/operation.json
        else
          uv run election-guide release automation finalize --upload dist/upload/upload.json --output-dir dist/finalization
          uv run election-guide release automation deployment-status --upload dist/upload/upload.json
        fi
    - name: Preserve finalization
      uses: actions/upload-artifact@v4
      with:
        name: finalization-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          dist/upload
          dist/finalization
        if-no-files-found: error
        retention-days: 7
      if: always()
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.run_id)
    || 'verified-release-mainline' }}
  queue: max
  cancel-in-progress: false
