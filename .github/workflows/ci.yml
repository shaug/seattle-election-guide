name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright

  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CHANGELOG.md is rendered from the complete commit history and its
          # release tags, so the default shallow, tagless checkout would
          # regenerate a different file (issue 216).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Lint, type-check, and test the client modules
        run: make check-js
      - name: Verify the committed changelog matches history
        run: make check-changelog

  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate canonical election inventory
        run: uv run election-guide inventory validate data/normalized/wa-2026-primary-inventory.json
      - name: Validate the source registry
        run: uv run election-guide sources validate config/sources/default.yaml
      - name: Validate the election operations calendar
        run: uv run election-guide calendar validate config/calendar/elections.yaml
      # Every election the site serves is resolved from its published release
      # archive, so a declared version with no published Release is a broken
      # deployment waiting to happen (docs/HOSTING.md, Published releases).
      - name: Verify declared release versions are published
        run: uv run election-guide hosting verify-releases config/hosting/site.yaml
        env:
          # The automatic job token, not a deployment secret: this job runs on
          # pull requests and is held to the workflow's read-only permissions.
          GH_TOKEN: ${{ github.token }}
      - name: Verify reproducible primary release inputs
        run: uv run election-guide release verify data/releases/wa-2026-primary/source-decisions.yaml
      # A manifest whose bytes nobody holds is not intact evidence, and one-at-
      # a-time verification never revealed that -- the 2026-08-04 election-night
      # capture verified at capture time and died with the worktree that wrote
      # it (issue #357). Official-authority bytes are tracked, so this is a real
      # gate here: a manifest committed without its bytes fails the pull
      # request. Restricted bytes never reach CI, so those report
      # `expected-absent` and pass (docs/COLLECTION.md). Defined once in the
      # Makefile and invoked with no arguments, the same way check-js and
      # check-changelog are, so CI and a contributor cannot drift apart.
      - name: Verify captured evidence bytes are present
        run: make check-evidence
      - name: Validate committed election results
        run: make check-results

  tests:
    name: pytest (${{ matrix.partition }})
    strategy:
      # A fast failure in one partition must not hide independent failures in
      # the other three (issue #428).
      fail-fast: false
      matrix:
        partition:
          - unit
          - integration-comparisons
          - integration-rendering
          - integration-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      # Rendering bundles each page's client entry with pinned esbuild, so all
      # partitions need Node even when pytest is their entry point
      # (docs/FRONTEND.md, Modules).
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        if: startsWith(matrix.partition, 'integration-')
        run: google-chrome --version
      - name: Run partition
        run: make test-${{ matrix.partition }}

  publication:
    name: Publication build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        run: google-chrome --version
      # The gate itself is defined once, in the Makefile, and invoked here with
      # no arguments the same way check-js and check-changelog are (issue #367),
      # so the procedure CI runs and the one a contributor runs cannot drift
      # apart. The staging step below consumes the first of its two builds.
      - name: Build and verify deterministic primary release
        run: |
          make check-release-reproducible
          unzip -t dist/reproducibility-a/seattle-election-guide-2026-primary.2.zip
          unzip -Z1 dist/reproducibility-a/seattle-election-guide-2026-primary.2.zip \
            | grep -Fx 'seattle-election-guide/validation/rendering/rendering_validation_report.json'
          unzip -Z1 dist/reproducibility-a/seattle-election-guide-2026-primary.2.zip \
            | grep -Fx 'seattle-election-guide/validation/rendering/screenshots/desktop.png'
          test "$(stat -c '%a' dist/reproducibility-a)" = 755
      # Only the current election is built from source above. Any other declared
      # election is resolved from the release that published it, because a
      # historical bundle cannot be rebuilt (docs/HOSTING.md, Historical bundles).
      - name: Stage verified Cloudflare Pages site
        run: |
          uv run election-guide hosting stage config/hosting/site.yaml \
            --bundle wa-2026-primary-2026-primary.2=dist/reproducibility-a/bundle \
            --released-bundle-dir dist/released-bundles \
            --expected-git-commit "$GITHUB_SHA" \
            --output-dir dist/cloudflare-site
          test -f dist/cloudflare-site/e/index.html
          test -f dist/cloudflare-site/e/wa-2026-primary/index.html
          test -f dist/cloudflare-site/e/wa-2026-primary/comparisons/index.html
          test -z "$(find dist/cloudflare-site -name '*.pdf' -print -quit)"
          uv run election-guide hosting verify \
            config/hosting/site.yaml \
            dist/cloudflare-site \
            --expected-git-commit "$GITHUB_SHA"
        env:
          # Downloading a historical bundle reads a published release. Same
          # read-only job token as the release-version check above.
          GH_TOKEN: ${{ github.token }}
      - name: Upload Cloudflare Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-site
          path: dist/cloudflare-site
          if-no-files-found: error
          retention-days: 7

  # Branch protection requires the existing `check` status. Keep that one
  # stable gate while the work behind it fans out across independent runners.
  check:
    name: check
    if: ${{ always() }}
    needs: [python, client, contracts, tests, publication]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
        run: |
          for result in "$PYTHON_RESULT" "$CLIENT_RESULT" "$CONTRACTS_RESULT" \
              "$TESTS_RESULT" "$PUBLICATION_RESULT"; do
            test "$result" = success
          done

  deploy:
    name: Deploy to Cloudflare Pages
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://seattle-elections.dobravoda.dev
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Wrangler
        run: npm ci --ignore-scripts
      - name: Verify Wrangler version
        run: npm run pages:version
      - name: Download verified Pages site
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-site
          path: dist/cloudflare-site
      - name: Verify downloaded Pages site
        run: >-
          uv run election-guide hosting verify
          config/hosting/site.yaml
          dist/cloudflare-site
          --expected-git-commit="$GITHUB_SHA"
      - name: Deploy production site
        run: >-
          npm run pages:deploy --
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
