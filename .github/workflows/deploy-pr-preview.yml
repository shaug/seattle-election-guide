name: PR preview

# Previews are opt-in per pull request (issue 210). The build is expensive --
# Chromium rendering plus a full release build -- and most pull requests here
# change data or prose with no visual surface, so a label decides rather than
# every push paying for a deployment.
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PR preview
    # The head-repository guard is what keeps the Cloudflare token away from
    # code this repository does not control. A fork's pull request skips this
    # job rather than failing it. `pull_request_target` would run the fork's
    # code with the token in scope, which is why this workflow does not use it;
    # a contributor's branch is previewed by pushing it to origin instead.
    # Gating on state rather than only on the action keeps a `labeled` event on
    # an already-closed pull request from deploying a preview that no later
    # close event would ever tear down.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy preview') &&
      (!contains(github.event.pull_request.labels.*.name, 'preview primary from source') ||
       github.event.pull_request.draft == true) &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to this job rather than the workflow. A workflow-level cancelling
    # group would also cover teardown, and a superseding event arriving while a
    # close-triggered teardown was still running would cancel it -- with no
    # second `closed` event to retry it, the preview would survive.
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The pull_request event's own SHA is an ephemeral merge commit that
      # exists in no branch. The audit footer has to show a commit a reader can
      # actually look up, so every step that records one uses the head instead.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Consumed by the `pages:deploy` script, which defaults to main.
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        run: google-chrome --version
      - name: Verify Wrangler version
        run: npm run pages:version
      - name: Verify declared releases for prepublication staging
        run: |
          mkdir -p dist
          uv run election-guide release automation resolve > dist/resolved.json
          uv run election-guide hosting verify-releases config/hosting/site.yaml \
            --candidate-bundle-id "$(jq -r .current.bundle_id dist/resolved.json)"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify original published primary pins
        if: contains(github.event.pull_request.labels.*.name, 'preview primary from source')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          from election_guide.hosting.pages import read_site_manifest
          from election_guide.hosting.pages import _verify_bundle
          from election_guide.hosting.releases import materialize_released_bundle

          site = read_site_manifest(Path("config/hosting/site.yaml"))
          primary = next(e for e in site.elections if e.election_id == "wa-2026-primary")
          bundle = materialize_released_bundle(primary, Path("dist/original-primary"))
          _verify_bundle(primary, bundle)
          receipt = {
              "original_site_sha256": hashlib.sha256(Path("config/hosting/site.yaml").read_bytes()).hexdigest(),
              "verified_primary": primary.model_dump(mode="json"),
          }
          output = Path("dist/original-primary-verification.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PYTHON
      - name: Build both unpublished preview elections at the pull request head
        if: contains(github.event.pull_request.labels.*.name, 'preview primary from source')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          uv run python - <<'PYTHON'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from election_guide.hosting import bundle_hash
          from election_guide.hosting.pages import read_site_manifest
          from election_guide.hosting.releases import extract_release_bundle
          from election_guide.release.builder import build_release
          from election_guide.release.comparison import compare_release_bundles, verify_release_bundle_artifacts

          head = os.environ["HEAD_SHA"]
          pr = os.environ["PR_NUMBER"]
          if not pr.isdecimal() or int(pr) <= 0:
              raise ValueError("preview needs the actual pull request number")
          generated_at = datetime.fromisoformat(subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", head], text=True).strip())
          site = read_site_manifest(Path("config/hosting/site.yaml"))
          for short in ("general", "primary"):
              election = f"wa-2026-{short}"
              root = Path("data/releases") / election
              version = f"preview-pr-{pr}-{short}-{head}"
              builds = []
              for suffix in ("a", "b"):
                  builds.append(build_release(
                      ledger_path=root / "source-decisions.yaml",
                      inventory_path=Path(f"data/normalized/{election}-inventory.json"),
                      registry_path=Path("config/sources") / ("default.yaml" if short == "primary" else f"{election}.yaml"),
                      dataset_path=Path("data/normalized") / ("canonical-dataset.json" if short == "primary" else f"{election}-canonical-dataset.json"),
                      snapshot_root=root / "snapshots",
                      manifest_dir=root / "manifests",
                      scoring_config_path=Path("config/scoring/default.yaml"),
                      rendering_config_path=Path("config/rendering/guide.yaml"),
                      output_dir=Path(f"dist/{short}-preview-{suffix}"),
                      release_version=version, generated_at=generated_at, git_commit=head,
                  ))
              first, second = builds
              compare_release_bundles(first.bundle_dir, second.bundle_dir)
              for result in builds:
                  verify_release_bundle_artifacts(result.bundle_dir)
                  declaration = next(e for e in site.elections if e.election_id == election).model_copy(
                      update={"bundle_id": f"{election}-{version}", "release_version": version})
                  extracted = result.output_dir / "verified-archive"
                  extract_release_bundle(result.archive_path, extracted, declaration)
                  verify_release_bundle_artifacts(extracted)
                  if bundle_hash(extracted) != bundle_hash(result.bundle_dir):
                      raise ValueError("preview ZIP differs from its verified bundle")
          PYTHON
      - name: Stage and verify both head-built preview bundles
        if: contains(github.event.pull_request.labels.*.name, 'preview primary from source')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml
          from election_guide.hosting import bundle_hash, stage_pages_site

          head = os.environ["HEAD_SHA"]
          site = yaml.safe_load(Path("config/hosting/site.yaml").read_text())
          assignments = {}
          for short in ("general", "primary"):
              election = f"wa-2026-{short}"
              declaration = next(e for e in site["elections"] if e["election_id"] == election)
              bundle = Path(f"dist/{short}-preview-a/bundle")
              status = json.loads((bundle / "release-status.json").read_text())
              version = f"preview-pr-{os.environ['PR_NUMBER']}-{short}-{head}"
              if status["release_version"] != version:
                  raise ValueError("preview must use this PR head's unpublished identity")
              if status["git_commit"] != head:
                  raise ValueError("preview Git commit differs from this PR head")
              declaration.update(
                  bundle_id=f"{election}-{version}", release_version=version,
                  publication_request=None,
                  source_panel_id=status["source_panel_id"], source_panel_hash=status["source_panel_hash"],
                  source_registry_hash=status.get("source_registry_hash"), git_commit=head,
                  release_manifest_sha256=hashlib.sha256((bundle / "release-manifest.json").read_bytes()).hexdigest(),
                  bundle_sha256=bundle_hash(bundle),
              )
              assignments[declaration["bundle_id"]] = bundle
          preview = Path("dist/preview-site.yaml")
          preview.write_text(yaml.safe_dump(site, sort_keys=False))
          stage_pages_site(preview, assignments, Path("dist/cloudflare-site"), expected_current_git_commit=head)
          PYTHON
          uv run election-guide hosting verify dist/preview-site.yaml dist/cloudflare-site --expected-git-commit "$HEAD_SHA"
      - name: Check served preview Updates against production
        if: contains(github.event.pull_request.labels.*.name, 'preview primary from source')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run election-guide hosting check-updates dist/cloudflare-site --output-path dist/updates-check.json
      # Ordinary previews keep the declared current-release builder.
      - name: Build the general release at the pull request head
        if: "!contains(github.event.pull_request.labels.*.name, 'preview primary from source')"
        run: uv run election-guide release automation build --source-sha "$HEAD_SHA" --output-dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      # Only the election built from source above is supplied locally. Any other
      # declared election is resolved from the release that published it,
      # exactly as CI stages it -- a historical bundle cannot be rebuilt
      # (docs/HOSTING.md, Historical bundles).
      - name: Stage and verify the Pages site
        if: "!contains(github.event.pull_request.labels.*.name, 'preview primary from source')"
        run: |
          uv run election-guide release automation stage \
            --bundle-dir dist/reproducibility-a/bundle \
            --source-sha "$HEAD_SHA" \
            --output-dir dist/cloudflare-site
          uv run election-guide hosting verify \
            config/hosting/site.yaml \
            dist/cloudflare-site \
            --expected-git-commit "$HEAD_SHA"
        env:
          # Downloading a historical bundle reads a published release. The
          # automatic job token, scoped by this job's `permissions:` block
          # above, of which the download needs only `contents: read`. It is not
          # a Cloudflare credential and grants nothing outside this repository;
          # what keeps a fork out of this job is the head-repository guard, not
          # this token's scope. The comment step below already carries it.
          GH_TOKEN: ${{ github.token }}
      # The alias is derived from the pull request number rather than the branch
      # name, so it is stable across pushes and immune to the mangling real
      # branch names get.
      - name: Deploy the preview
        id: deploy
        run: |
          npm run pages:deploy -- \
            --commit-hash="$HEAD_SHA" \
            --commit-dirty=false
          echo "url=https://${PAGES_BRANCH}.seattle-elections.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # One comment per pull request, rewritten in place, so a long-running
      # branch does not accumulate a link per push. `--edit-last` targets this
      # workflow's own previous comment, which is unambiguous because nothing
      # else comments here as the Actions bot.
      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '**Preview:** %s\n\nBuilt from `%s`. Every non-canonical host is `noindex`, so this copy cannot appear in search results. Removing the `deploy preview` label stops future deployments; closing this pull request tears this one down.\n' \
            "$PREVIEW_URL" "$HEAD_SHA" > comment.md
          gh pr comment "$PR_NUMBER" \
            --body-file comment.md \
            --edit-last \
            --create-if-none

  teardown:
    name: Remove PR preview
    # Deliberately not label-gated. A preview that was deployed and then had its
    # label removed must still be cleaned up when the pull request closes, so
    # this runs on every same-repository close and no-ops when it finds nothing.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately the deploy job's group, so a close landing mid-build queues
    # behind the upload instead of racing it: teardown would otherwise delete
    # the current deployments and let the still-running deploy publish a fresh
    # one that no later event would ever clean up. `cancel-in-progress: false`
    # means teardown itself cancels nothing; only a `reopened` deploy can
    # displace a pending teardown, which is what reopening should do.
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      # Pinned to the base branch on purpose. A bare checkout on a
      # `pull_request` event resolves refs/pull/<number>/merge, and GitHub
      # retires that ref when the pull request closes -- which is exactly when
      # this job runs. The job reads its lockfile from a
      # ref that still exists.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Wrangler
        run: npm ci --ignore-scripts
      - name: Delete this pull request's preview deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler lists only one page. Read the raw API through the final
          # empty page, even when earlier pages contain no matching branch.
          # Use Cloudflare's default page size rather than a custom override.
          # Finish enumeration before deleting: deletion would shift later
          # pages, and a failed listing must never look like an empty result.
          page=1
          : > deployment-ids.txt
          while true; do
            curl --fail --silent --show-error --get \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/seattle-elections/deployments" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data-urlencode "env=preview" \
              --data-urlencode "page=$page" \
              --output deployments.json
            if ! jq -e '
              .success == true and (.result | type == "array") and
              all(.result[];
                (.id | type == "string" and length > 0) and
                (.environment == "preview" or .environment == "production") and
                (.deployment_trigger.metadata.branch | type == "string"))
              ' deployments.json > /dev/null; then
              echo "::error::Could not enumerate preview deployments: unsuccessful or malformed Cloudflare response on page $page."
              exit 1
            fi
            jq -r --arg branch "$PREVIEW_BRANCH" \
              '.result[] | select(.environment == "preview" and .deployment_trigger.metadata.branch == $branch) | .id' \
              deployments.json >> deployment-ids.txt
            count="$(jq '.result | length' deployments.json)"
            if [ "$count" -eq 0 ]; then
              break
            fi
            page=$((page + 1))
          done
          if [ ! -s deployment-ids.txt ]; then
            echo "No preview deployments found for $PREVIEW_BRANCH."
            exit 0
          fi
          while IFS= read -r id; do
            echo "Deleting deployment $id"
            npx wrangler pages deployment delete "$id" \
              --project-name seattle-elections \
              --force
          done < deployment-ids.txt
