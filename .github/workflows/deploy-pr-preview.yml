name: PR preview

# Previews are opt-in per pull request (issue 210). The build is expensive --
# Chromium rendering plus a full release build -- and most pull requests here
# change data or prose with no visual surface, so a label decides rather than
# every push paying for a deployment.
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

# Serialize build, upload and cleanup together. Never cancel a partial upload or
# deletion. Pending runs may replace one another, so every run reads current PR
# state rather than assuming event order.
concurrency:
  group: pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  admission:
    name: Resolve current PR preview intent
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.admit.outputs.deploy }}
      head_sha: ${{ steps.admit.outputs.head_sha }}
    steps:
      - name: Read current PR preview state
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: &read_preview_state |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > preview-state.json
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --argjson number "$PR_NUMBER" '
            .number == $number and (.state == "open" or .state == "closed") and
            .head.repo.full_name == $repo and .base.repo.full_name == $repo and
            (.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.labels | type == "array") and all(.labels[]; .name | type == "string")
            ' preview-state.json > /dev/null; then
            echo "::error::Current PR preview state is malformed or belongs to another PR/repository."
            exit 1
          fi
          head_sha="$(jq -r '.head.sha' preview-state.json)"
          deploy="$(jq -r '.state == "open" and any(.labels[]; .name == "deploy preview")' preview-state.json)"
          cleanup=true
          if [ "$deploy" = true ]; then
            cleanup=false
          elif [ -n "${PREVIEW_DEPLOY_RESULT:-}" ]; then
            # A skipped upload can still have previews from earlier runs. The
            # deployment job has used this exact environment since its introduction.
            gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
              -f "environment=pr-${PR_NUMBER}" -F per_page=1 > preview-history.json
            if ! jq -se --arg env "pr-${PR_NUMBER}" --arg repo "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" '
              length == 1 and (.[0] | type == "array" and length <= 1 and
                all(.[]; .environment == $env and .repository_url == $repo and
                  (.id | type == "number" and . > 0 and . == floor)))
              ' preview-history.json > /dev/null; then
              echo "::error::Invalid deployment history for pr-${PR_NUMBER}."
              exit 1
            fi
            cleanup="$(jq 'length > 0' preview-history.json)"
            if [ "$cleanup" = false ] && [ "$PREVIEW_DEPLOY_RESULT" != skipped ]; then
              echo "::error::Deployment job was $PREVIEW_DEPLOY_RESULT but its history is missing; retry reconciliation."
              exit 1
            fi
          fi
          if [ -n "${EXPECTED_HEAD:-}" ] && [ "$head_sha" != "$EXPECTED_HEAD" ]; then
            echo "::notice::PR head changed during the build; skip this stale upload."
            deploy=false
          fi
          printf 'head_sha=%s\ndeploy=%s\ncleanup=%s\n' "$head_sha" "$deploy" "$cleanup" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy PR preview
    # The head-repository guard is what keeps the Cloudflare token away from
    # code this repository does not control. A fork's pull request skips this
    # job rather than failing it. `pull_request_target` would run the fork's
    # code with the token in scope, which is why this workflow does not use it;
    # a contributor's branch is previewed by pushing it to origin instead.
    # Do not enter the environment-bearing deployment job for opted-out PRs.
    needs: admission
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true' &&
      needs.admission.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
      # Consumed by the `pages:deploy` script, which defaults to main.
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        run: google-chrome --version
      - name: Verify Wrangler version
        run: npm run pages:version
      - name: Verify declared releases for prepublication staging
        run: |
          mkdir -p dist
          uv run election-guide release automation resolve > dist/resolved.json
          uv run election-guide hosting verify-releases config/hosting/site.yaml \
            --candidate-bundle-id "$(jq -r .current.bundle_id dist/resolved.json)"
        env:
          GH_TOKEN: ${{ github.token }}
      # Use the same declared current-release builder as CI and local staging.
      - name: Build the general release at the pull request head
        run: uv run election-guide release automation build --source-sha "$HEAD_SHA" --output-dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      # Only the election built from source above is supplied locally. Any other
      # declared election is resolved from the release that published it,
      # exactly as CI stages it -- a historical bundle cannot be rebuilt
      # (docs/HOSTING.md, Historical bundles).
      - name: Stage and verify the Pages site
        run: |
          uv run election-guide release automation stage \
            --bundle-dir dist/reproducibility-a/bundle \
            --source-sha "$HEAD_SHA" \
            --output-dir dist/cloudflare-site
          uv run election-guide hosting verify \
            config/hosting/site.yaml \
            dist/cloudflare-site \
            --expected-git-commit "$HEAD_SHA"
        env:
          # Downloading a historical bundle reads a published release. The
          # automatic job token, scoped by this job's `permissions:` block
          # above, of which the download needs only `contents: read`. It is not
          # a Cloudflare credential and grants nothing outside this repository;
          # what keeps a fork out of this job is the head-repository guard, not
          # this token's scope. The comment step below already carries it.
          GH_TOKEN: ${{ github.token }}
      # The alias is derived from the pull request number rather than the branch
      # name, so it is stable across pushes and immune to the mangling real
      # branch names get.
      - name: Recheck current state immediately before upload
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ needs.admission.outputs.head_sha }}
        run: *read_preview_state
      - name: Deploy the preview
        if: steps.recheck.outputs.deploy == 'true'
        id: deploy
        run: |
          npm run pages:deploy -- \
            --commit-hash="$HEAD_SHA" \
            --commit-dirty=false
          echo "url=https://${PAGES_BRANCH}.seattle-elections.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # One comment per pull request, rewritten in place, so a long-running
      # branch does not accumulate a link per push. `--edit-last` targets this
      # workflow's own previous comment, which is unambiguous because nothing
      # else comments here as the Actions bot.
      - name: Comment the preview link
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '**Preview:** %s\n\nBuilt from `%s`. Every non-canonical host is `noindex`, so this copy cannot appear in search results. Removing the `deploy preview` label or closing this pull request tears this preview down.\n' \
            "$PREVIEW_URL" "$HEAD_SHA" > comment.md
          gh pr comment "$PR_NUMBER" \
            --body-file comment.md \
            --edit-last \
            --create-if-none

  teardown:
    name: Remove PR preview
    # Run after any build/upload outcome. A label removed mid-upload must be
    # reconciled before this workflow releases the PR lock. Re-added labels and
    # reopened PRs are evaluated from the live response, not the old event.
    needs: [admission, deploy]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Read current state after build or upload
        id: current
        env:
          PREVIEW_DEPLOY_RESULT: ${{ needs.deploy.result }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: *read_preview_state
      # Pinned to the base branch on purpose. A bare checkout on a
      # `pull_request` event resolves refs/pull/<number>/merge, and GitHub
      # retires that ref when the pull request closes -- which is exactly when
      # this job runs. The job reads its lockfile from a
      # ref that still exists.
      - uses: actions/checkout@v4
        if: steps.current.outputs.cleanup == 'true'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        if: steps.current.outputs.cleanup == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Wrangler
        if: steps.current.outputs.cleanup == 'true'
        run: npm ci --ignore-scripts
      - name: Delete this pull request's preview deployments
        if: steps.current.outputs.cleanup == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}" "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          # Wrangler lists only one page. Read the raw API through the final
          # empty page, even when earlier pages contain no matching branch.
          # Use Cloudflare's default page size rather than a custom override.
          # Finish enumeration before deleting: deletion would shift later
          # pages, and a failed listing must never look like an empty result.
          list_preview_ids() {
            local page=1 count
            while true; do
              curl --fail --silent --show-error --get \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/seattle-elections/deployments" \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --data-urlencode "env=preview" \
                --data-urlencode "page=$page" \
                --output deployments.json
              if ! jq -se '
                length == 1 and (.[0] | .success == true and .errors == [] and
                (.result | type == "array") and
                all(.result[];
                  (.id | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*\\z")) and
                  (.environment == "preview" or .environment == "production") and
                  (.deployment_trigger.metadata.branch | type == "string")))
                ' deployments.json > /dev/null; then
                echo "::error::Could not enumerate preview deployments: unsuccessful or malformed Cloudflare response on page $page." >&2
                exit 1
              fi
              jq -r --arg branch "$PREVIEW_BRANCH" \
                '.result[] | select(.environment == "preview" and .deployment_trigger.metadata.branch == $branch) | .id' \
                deployments.json
              count="$(jq '.result | length' deployments.json)"
              if [ "$count" -eq 0 ]; then
                break
              fi
              page=$((page + 1))
            done
          }
          list_preview_ids > deployment-ids.txt
          if [ ! -s deployment-ids.txt ]; then
            echo "No preview deployments found for $PREVIEW_BRANCH."
            exit 0
          fi
          delete_failed=false
          while IFS= read -r id; do
            echo "Deleting deployment $id"
            npx wrangler pages deployment delete "$id" \
              --project-name seattle-elections \
              --force || delete_failed=true
          done < deployment-ids.txt
          if [ "$delete_failed" = true ]; then
            # Another actor may already have removed the deployment. Only a
            # fresh, complete inventory can establish the desired end state.
            list_preview_ids > remaining-ids.txt
            if [ -s remaining-ids.txt ]; then
              echo "::error::Preview deployments remain for $PREVIEW_BRANCH after deletion failed."
              exit 1
            fi
            echo "Verified no remaining preview deployments for $PREVIEW_BRANCH."
          fi
