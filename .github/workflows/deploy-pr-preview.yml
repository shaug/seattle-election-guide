name: PR preview

# Previews are opt-in per pull request (issue 210). The build is expensive --
# Chromium rendering plus a full release build -- and most pull requests here
# change data or prose with no visual surface, so a label decides rather than
# every push paying for a deployment.
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PR preview
    # The head-repository guard is what keeps the Cloudflare token away from
    # code this repository does not control. A fork's pull request skips this
    # job rather than failing it. `pull_request_target` would run the fork's
    # code with the token in scope, which is why this workflow does not use it;
    # a contributor's branch is previewed by pushing it to origin instead.
    # Gating on state rather than only on the action keeps a `labeled` event on
    # an already-closed pull request from deploying a preview that no later
    # close event would ever tear down.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy preview') &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to this job rather than the workflow. A workflow-level cancelling
    # group would also cover teardown, and a superseding event arriving while a
    # close-triggered teardown was still running would cancel it -- with no
    # second `closed` event to retry it, the preview would survive.
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The pull_request event's own SHA is an ephemeral merge commit that
      # exists in no branch. The audit footer has to show a commit a reader can
      # actually look up, so every step that records one uses the head instead.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Consumed by the `pages:deploy` script, which defaults to main.
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        run: google-chrome --version
      - name: Verify Wrangler version
        run: npm run pages:version
      - name: Verify declared releases for prepublication staging
        run: |
          mkdir -p dist
          uv run election-guide release automation resolve > dist/resolved.json
          uv run election-guide hosting verify-releases config/hosting/site.yaml \
            --candidate-bundle-id "$(jq -r .current.bundle_id dist/resolved.json)"
        env:
          GH_TOKEN: ${{ github.token }}
      # Use the same declared current-release builder as CI and local staging.
      - name: Build the general release at the pull request head
        run: uv run election-guide release automation build --source-sha "$HEAD_SHA" --output-dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      # Only the election built from source above is supplied locally. Any other
      # declared election is resolved from the release that published it,
      # exactly as CI stages it -- a historical bundle cannot be rebuilt
      # (docs/HOSTING.md, Historical bundles).
      - name: Stage and verify the Pages site
        run: |
          uv run election-guide release automation stage \
            --bundle-dir dist/reproducibility-a/bundle \
            --source-sha "$HEAD_SHA" \
            --output-dir dist/cloudflare-site
          uv run election-guide hosting verify \
            config/hosting/site.yaml \
            dist/cloudflare-site \
            --expected-git-commit "$HEAD_SHA"
        env:
          # Downloading a historical bundle reads a published release. The
          # automatic job token, scoped by this job's `permissions:` block
          # above, of which the download needs only `contents: read`. It is not
          # a Cloudflare credential and grants nothing outside this repository;
          # what keeps a fork out of this job is the head-repository guard, not
          # this token's scope. The comment step below already carries it.
          GH_TOKEN: ${{ github.token }}
      # The alias is derived from the pull request number rather than the branch
      # name, so it is stable across pushes and immune to the mangling real
      # branch names get.
      - name: Deploy the preview
        id: deploy
        run: |
          npm run pages:deploy -- \
            --commit-hash="$HEAD_SHA" \
            --commit-dirty=false
          echo "url=https://${PAGES_BRANCH}.seattle-elections.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # One comment per pull request, rewritten in place, so a long-running
      # branch does not accumulate a link per push. `--edit-last` targets this
      # workflow's own previous comment, which is unambiguous because nothing
      # else comments here as the Actions bot.
      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '**Preview:** %s\n\nBuilt from `%s`. Every non-canonical host is `noindex`, so this copy cannot appear in search results. Removing the `deploy preview` label stops future deployments; closing this pull request tears this one down.\n' \
            "$PREVIEW_URL" "$HEAD_SHA" > comment.md
          gh pr comment "$PR_NUMBER" \
            --body-file comment.md \
            --edit-last \
            --create-if-none

  teardown:
    name: Remove PR preview
    # Deliberately not label-gated. A preview that was deployed and then had its
    # label removed must still be cleaned up when the pull request closes, so
    # this runs on every same-repository close and no-ops when it finds nothing.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately the deploy job's group, so a close landing mid-build queues
    # behind the upload instead of racing it: teardown would otherwise delete
    # the current deployments and let the still-running deploy publish a fresh
    # one that no later event would ever clean up. `cancel-in-progress: false`
    # means teardown itself cancels nothing; only a `reopened` deploy can
    # displace a pending teardown, which is what reopening should do.
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      # Pinned to the base branch on purpose. A bare checkout on a
      # `pull_request` event resolves refs/pull/<number>/merge, and GitHub
      # retires that ref when the pull request closes -- which is exactly when
      # this job runs. The job reads its lockfile from a
      # ref that still exists.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Wrangler
        run: npm ci --ignore-scripts
      - name: Delete this pull request's preview deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler lists only one page. Read the raw API through the final
          # empty page, even when earlier pages contain no matching branch.
          # Use Cloudflare's default page size rather than a custom override.
          # Finish enumeration before deleting: deletion would shift later
          # pages, and a failed listing must never look like an empty result.
          page=1
          : > deployment-ids.txt
          while true; do
            curl --fail --silent --show-error --get \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/seattle-elections/deployments" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data-urlencode "env=preview" \
              --data-urlencode "page=$page" \
              --output deployments.json
            if ! jq -e '
              .success == true and (.result | type == "array") and
              all(.result[];
                (.id | type == "string" and length > 0) and
                (.environment == "preview" or .environment == "production") and
                (.deployment_trigger.metadata.branch | type == "string"))
              ' deployments.json > /dev/null; then
              echo "::error::Could not enumerate preview deployments: unsuccessful or malformed Cloudflare response on page $page."
              exit 1
            fi
            jq -r --arg branch "$PREVIEW_BRANCH" \
              '.result[] | select(.environment == "preview" and .deployment_trigger.metadata.branch == $branch) | .id' \
              deployments.json >> deployment-ids.txt
            count="$(jq '.result | length' deployments.json)"
            if [ "$count" -eq 0 ]; then
              break
            fi
            page=$((page + 1))
          done
          if [ ! -s deployment-ids.txt ]; then
            echo "No preview deployments found for $PREVIEW_BRANCH."
            exit 0
          fi
          while IFS= read -r id; do
            echo "Deleting deployment $id"
            npx wrangler pages deployment delete "$id" \
              --project-name seattle-elections \
              --force
          done < deployment-ids.txt
