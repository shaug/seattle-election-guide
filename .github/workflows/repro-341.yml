name: Repro 341 (temporary, diagnostic only)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of build-pair iterations'
        default: '15'

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check the rendering browser
        run: google-chrome --version
      - name: Repro loop
        run: |
          set -u
          SITE_UPDATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          N="${{ github.event.inputs.iterations }}"
          FAILURES=0
          for i in $(seq 1 "$N"); do
            echo "=== iteration $i (generated-at $SITE_UPDATED_AT) ==="
            rm -rf dist/ci-release-a dist/ci-release-b
            uv run election-guide release build data/releases/wa-2026-primary/source-decisions.yaml \
                --release-version 2026-primary.2 \
                --generated-at "$SITE_UPDATED_AT" \
              --output-dir dist/ci-release-a
            uv run election-guide release build data/releases/wa-2026-primary/source-decisions.yaml \
                --release-version 2026-primary.2 \
                --generated-at "$SITE_UPDATED_AT" \
              --output-dir dist/ci-release-b
            if cmp dist/ci-release-a/seattle-election-guide-2026-primary.2.zip \
                    dist/ci-release-b/seattle-election-guide-2026-primary.2.zip; then
              echo "iteration $i: IDENTICAL"
            else
              echo "iteration $i: DIFFERS"
              FAILURES=$((FAILURES+1))
              mkdir -p /tmp/repro-artifacts/iter-$i
              cp dist/ci-release-a/seattle-election-guide-2026-primary.2.zip /tmp/repro-artifacts/iter-$i/a.zip
              cp dist/ci-release-b/seattle-election-guide-2026-primary.2.zip /tmp/repro-artifacts/iter-$i/b.zip
              mkdir -p /tmp/repro-artifacts/iter-$i/a /tmp/repro-artifacts/iter-$i/b
              (cd /tmp/repro-artifacts/iter-$i/a && unzip -q ../a.zip)
              (cd /tmp/repro-artifacts/iter-$i/b && unzip -q ../b.zip)
              diff -rq /tmp/repro-artifacts/iter-$i/a /tmp/repro-artifacts/iter-$i/b > /tmp/repro-artifacts/iter-$i/diff-summary.txt || true
              cat /tmp/repro-artifacts/iter-$i/diff-summary.txt
            fi
          done
          echo "TOTAL_FAILURES=$FAILURES" >> "$GITHUB_ENV"
          echo "done, failures=$FAILURES"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-341-artifacts
          path: /tmp/repro-artifacts
          if-no-files-found: ignore
          retention-days: 3
