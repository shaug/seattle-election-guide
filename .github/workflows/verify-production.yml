name: Production availability

# #512: one availability probe per hourly tick. Every dispatched run probes
# even when GitHub starts it late; execution time must never decide whether
# the site gets checked. Release identity is verified after an approved
# deployment in ci.yml, because unpublished main changes are expected.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the result without opening, updating, or closing an alert issue
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # A run still in flight when the next one fires would race the same alert
  # issue; queuing rather than canceling keeps every check's result recorded.
  group: verify-production
  cancel-in-progress: false

env:
  PRODUCTION_ORIGIN: https://seattleelections.guide

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the pipeline
        run: uv sync --frozen
      - name: Check production availability
        # Inputs reach the shell through the environment, never through
        # expression interpolation into the script itself.
        run: >-
          uv run election-guide hosting check-production
          "$PRODUCTION_ORIGIN"
          --availability-only
          --repository "$GITHUB_REPOSITORY"
          ${DRY_RUN:+--dry-run}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
