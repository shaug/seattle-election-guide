name: Verify production

# O14 (docs/SITE_OPERATIONS_PLAN.md, Epic F): confirm the live site responds
# correctly and is serving the commit currently on `main`, and raise a
# visible alert when it is not. The commit comparison catches a silently
# failed deploy that a plain uptime check would miss.
#
# GitHub Actions cron cannot vary by calendar data, so this fires every 15
# minutes unconditionally and a first step decides whether the run is
# actually due: always, inside the pre-election window (`calendar
# in-window`, D5 — election timing has exactly one source of truth), and
# otherwise only on the hour. That keeps one workflow at one file rather than
# a second, differently-scheduled copy, mirroring calendar.yml's own
# off-the-hour self-throttling. As with that workflow, GitHub's schedules are
# best effort and can be delayed or dropped under load; re-running is free,
# because a scheduled check is idempotent by nature.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the result without opening, updating, or closing an alert issue
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # A run still in flight when the next one fires would race the same alert
  # issue; queuing rather than canceling keeps every check's result recorded.
  group: verify-production
  cancel-in-progress: false

env:
  PRODUCTION_ORIGIN: https://seattleelections.guide

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the pipeline
        run: uv sync --frozen
      - name: Decide whether this run is due
        id: cadence
        if: github.event_name == 'schedule'
        run: |
          if uv run election-guide calendar in-window config/calendar/elections.yaml \
              --before-days 7; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%M)" = "00" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production is up and serving the expected commit
        if: github.event_name != 'schedule' || steps.cadence.outputs.due == 'true'
        # Inputs reach the shell through the environment, never through
        # expression interpolation into the script itself.
        run: >-
          uv run election-guide hosting check-production
          "$PRODUCTION_ORIGIN"
          --expected-git-commit "$(git rev-parse HEAD)"
          --repository "$GITHUB_REPOSITORY"
          ${DRY_RUN:+--dry-run}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
