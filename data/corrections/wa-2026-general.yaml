      - label: "King County Director of Elections"
        url: /e/wa-2026-general/races/king-county-director-of-elections/
      - label: "IP26-645"
        url: /e/wa-2026-general/races/initiative-26-645/
      - label: "Complete approved decisions and evidence"
        url: https://github.com/shaug/seattle-election-guide/blob/2026-general.16/docs/GENERAL_VERIFICATION_APPLICATION_2026-10-18.md
  - corrected_on: 2026-10-17
    headline: "Mobile meters now show percentages before inspection."
    body: >-
      Endorsement meters on mobile now show the same percentage summary as
      desktop. Press and hold a meter to reveal individual endorsements, then
      slide across it to see each source’s decision. Lifting your finger restores
      the summary; ordinary swipes still scroll the page.
    provenance:
      - label: "Endorsements"
        url: /e/wa-2026-general/
      - label: "Mobile meter interaction change"
        url: https://github.com/shaug/seattle-election-guide/issues/561
  - corrected_on: 2026-10-16
    headline: "Added two previously unrecorded endorsements."
    body: >-
      Washington Conservation Action’s No on IL26-638 and the Washington Education
      Association’s endorsement of Ashley Fedan for LD11 House Position 1 are now
      included. Both additions were published in the October 16 release after the
      official evidence was verified.
    provenance:
      - label: "IL26-638"
        url: /e/wa-2026-general/races/initiative-26-638/
      - label: "LD11 House Position 1"
