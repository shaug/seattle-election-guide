schema_version: "1.0"
election_id: wa-2026-general
entries:
  - corrected_on: 2026-10-23
    headline: "Removed uncontested races from the general-election guide."
    body: >-
      Races with only one official choice no longer appear in Endorsements,
      Comparisons, or individual race pages, even when organizations have
      endorsed that choice. The guide now shows the 31 contested races and
      measures. Source endorsement totals count these visible races only.
      The full records for all 52 races remain available in the audit downloads.
      The published primary archive is unchanged.
    provenance:
      - label: "Endorsements"
        url: /e/wa-2026-general/
      - label: "Race visibility policy and implementation"
        url: https://github.com/shaug/seattle-election-guide/issues/607
  - corrected_on: 2026-10-23
    headline: "Rounded the closing border of split endorsement meters."
    body: >-
      On race pages, the border now follows the curved transition at both ends
      of a partial-endorsement run. The straight line that crossed the closing
      split is gone. The opening split, full endorsements, meter sizes, colors,
      counts and percentages are unchanged.
    provenance:
      - label: "Race-page border correction"
        url: https://github.com/shaug/seattle-election-guide/issues/598
      - label: "Endorsements"
        url: /e/wa-2026-general/
  - corrected_on: 2026-10-22
    headline: "Added WashingtonCAN’s LD37 Senate endorsement."
    body: >-
      WashingtonCAN’s current 2026 endorsement gallery explicitly endorses
      Chipalo Street for LD37 Senate. That recommendation is now included,
      bringing the guide to 923 decisions across the same 46 publishers.
      All 922 previous decisions remain. The linked review records the
      original graphic, current source checks and remaining access limits.
    provenance:
      - label: "LD37 Senate"
        url: /e/wa-2026-general/races/ld-37-state-senator/
      - label: "Endorsements"
        url: /e/wa-2026-general/
