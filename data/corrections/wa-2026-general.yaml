        url: https://www.washingtoncan.org/endorsements
      - label: "October 22 review and limitations"
        url: https://github.com/shaug/seattle-election-guide/blob/2026-general.27/docs/GENERAL_VERIFICATION_2026-10-22.md
  - corrected_on: 2026-10-21
    headline: "Added Transit Riders Union’s four formal measure endorsements."
    body: >-
      Transit Riders Union’s October general-election article endorses Yes on
      Seattle’s transit Proposition 1 and No on initiatives 26-645, 26-001 and
      26-638. Those four decisions are now included, bringing the guide to 922
      decisions across the same 46 publishers. All 918 prior decisions remain.
      The linked review records the original article and graphic, literal source
      labels, and candidate recommendations still held for review.
    provenance:
      - label: "Seattle Transit Proposition 1"
        url: /e/wa-2026-general/races/seattle-proposition-1-transit/
