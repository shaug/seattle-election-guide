  actions: [correction, certified]
- corrected_on: 2026-08-08
  slug: counting-status-and-official-links
  headline: Added counting status and official results links.
  body: >-
    After election day, the guide linked readers to the official ongoing count and stated the scheduled
    certification date without publishing preliminary totals. Candidate cards briefly repeated that
    counting note. The stated August 19 certification date was later corrected to August 18.
  provenance:
