- corrected_on: 2026-07-19
  slug: first-primary-download
  headline: Published the first downloadable primary guide.
  body: >-
    The first release recorded 174 decisions from 17 organizations across 32 Seattle-ballot races
    and measures. It was available as a downloadable release before the website opened on July 21.
    This is the starting point for the history recorded above.
  provenance:
  - label: First primary release
