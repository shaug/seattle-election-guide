- corrected_on: 2026-07-21
  slug: endorsement-agreement-and-disclosures
  headline: Simplified endorsement agreement and source disclosures.
  body: >-
    The website replaced letter grades with the leading choice’s share among explicitly endorsing
    sources, a source count, and a warning when there were too few endorsements. Candidate lists linked
    each endorsement to its evidence and identified split endorsements. The source directory added
    participation counts and separated contributing organizations from two research gaps.
  provenance:
  - label: Primary guide
