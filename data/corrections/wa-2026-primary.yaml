  slug: source-selection-and-total
  headline: Moved source selection to its own page and corrected its total.
  body: >-
    Source selection moved to a Sources page with Save, Cancel and Reset actions, and the guide carried
    the current selection to that page. The guide’s selectable-source total was corrected from 42
    to 40 by excluding the two research gaps. Methodology moved from the guide into About.
