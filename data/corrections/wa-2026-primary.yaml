- corrected_on: 2026-07-31
  slug: races-without-majority
  headline: Marked races without a majority.
  body: >-
    A leading share at or below 50% received an amber meter and an explicit “No majority” label. The
    label followed the current source selection, including when that selection created or dissolved
    a tie.
