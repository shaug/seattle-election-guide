entries:
- corrected_on: 2026-10-16
  slug: customized-primary-sparse-leaders
  headline: Named sparse-race leaders in customized primary views.
  body: >-
    Rebuilding the archived primary guide brings its customized overview into line with the
    current display rule. A race with too few selected endorsements now names its measured
    leading choice while retaining the warning that there is too little evidence to measure
    agreement. The default all-sources overview, recorded endorsements, scores, and certified
    results are unchanged.
  provenance:
