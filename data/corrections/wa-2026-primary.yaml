- corrected_on: 2026-08-05
  slug: previously-missed-endorsements
  headline: Added 17 previously missed endorsements after election day.
  body: >-
    Rechecks added five Transit Riders Union decisions, two Working Families Party decisions, three
    from Sage Leaders, one each from SEIU 775 and UFCW 3000, and five from Seattle Gay News. The total
    rose from 521 to 538 across 11 affected races. Kelabe Tewolde in LD37 House Position 1 and Jaime
    Michelle Hawk in Supreme Court Position 3 moved ahead of previously tied choices. Other races
    changed counts or shares without changing their leading choice. August 5 is when the guide caught
    up, not when the organizations announced their endorsements.
  provenance:
  - label: LD37 House Position 1
    url: /e/wa-2026-primary/races/ld-37-state-representative-1/
  - label: Supreme Court Position 3
    url: /e/wa-2026-primary/races/supreme-court-justice-3/
