schema_version: '1.0'
election_id: wa-2026-primary
entries:
- corrected_on: 2026-10-11
  headline: Restored the completed primary guide.
  body: >-
    The archived guide again includes all 538 recorded decisions and certified results for all
    32 races. This restores the 17 endorsements recorded after the August 2 snapshot, along with the
    results and segmented endorsement bars that had disappeared during the general-election changeover.
    These are restored historical records, not new endorsements or a new certification. The overview
    again links to the individual race pages.
  provenance:
  - label: Primary guide
    url: /e/wa-2026-primary/
  - label: Restoration and verification
    url: https://github.com/shaug/seattle-election-guide/pull/526
  - label: Replacement primary release
    url: https://github.com/shaug/seattle-election-guide/releases/tag/2026-primary.3
  - label: Complete changes and publication dates
    url: >-
      https://github.com/shaug/seattle-election-guide/blob/2026-general.10/docs/UPDATES_HISTORY_AUDIT_2026-10-16.md#primary-page-changes
- corrected_on: 2026-10-03
  headline: An older primary snapshot replaced the completed guide.
  body: >-
    When the general guide became the site's main guide, the primary archive reverted to its August
    2 snapshot. Seventeen later recorded endorsements and all 32 certified race results disappeared.
    This was a change to the guide, not withdrawals by endorsing organizations. The completed primary
    was restored on October 11. Direct race addresses survived, but showed the older data; the overview
    returned to dialog navigation. Race share-preview bars also briefly changed before their previous
    display was restored that day.
  provenance:
  - label: General-election changeover
    url: https://github.com/shaug/seattle-election-guide/pull/476
  - label: First public changeover
    url: https://github.com/shaug/seattle-election-guide/actions/runs/37111424774
  - label: Incident and restoration
    url: https://github.com/shaug/seattle-election-guide/pull/526
  - label: Complete changes and publication dates
    url: >-
      https://github.com/shaug/seattle-election-guide/blob/2026-general.10/docs/UPDATES_HISTORY_AUDIT_2026-10-16.md#primary-page-changes
- corrected_on: 2026-09-13
  headline: Completed certified results for all 32 races.
  body: >-
    Washington Secretary of State totals filled the eight remaining races: Congressional District
    9, LD32 Senate and both House positions, and Supreme Court Positions 1, 3, 5, and 7. The original
    24 King County results are retained. Each race links to its own counting authority; statewide
    totals are labeled votes counted. The change was prepared in August but did not reach the website
    until September 13.
  provenance:
  - label: Primary guide
    url: /e/wa-2026-primary/
  - label: Statewide results and per-race evidence
    url: https://github.com/shaug/seattle-election-guide/pull/419
