    url: https://github.com/shaug/seattle-election-guide/issues/417#issuecomment-5658729647
  - label: Complete changes and publication dates
    url: >-
      https://github.com/shaug/seattle-election-guide/blob/2026-general.10/docs/UPDATES_HISTORY_AUDIT_2026-10-16.md#primary-page-changes
- corrected_on: 2026-08-19
  headline: Published certified results for 24 races and corrected the certification date.
  body: >-
    The guide now shows King County's certified August 18 results for 24 races, including every declared
    choice, vote shares, and who advanced or whether a measure passed. The other eight races await
    statewide totals. The certification date had been shown as August 19; it is August 18. Results
    appear alongside the endorsements and do not change their scores. Certified results can also be
    added to Comparisons without affecting its agreement labels.
  provenance:
  - label: Primary guide
    url: /e/wa-2026-primary/
  - label: Certification-date correction
    url: https://github.com/shaug/seattle-election-guide/pull/407
