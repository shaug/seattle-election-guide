    Race pages replaced the guide’s dialogs, with individual addresses, page titles and share previews.
    Existing race-fragment links forwarded to the new pages with the selected sources intact. Sole
    leaders were named once; ties used separate candidate headings and meters instead of a sole-leader
    headline.
