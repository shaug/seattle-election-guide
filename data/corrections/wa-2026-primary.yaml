  slug: personalized-race-details-and-shared-links
  headline: Corrected personalized race details and shared links.
  body: >-
    Race-detail counts, shares, meters, candidate order and accessible summaries were corrected to
    follow the current source selection. Unselected endorsement evidence remained visible as “Not
    counted,” ties used ballot order, and split-endorsement arithmetic received an explanation. Opening,
    closing or sharing race details preserved the selected sources; empty candidate meters were removed.
