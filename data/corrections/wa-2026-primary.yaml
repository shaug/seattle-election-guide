- corrected_on: 2026-07-23
  slug: six-organizations-and-decisions
  headline: Added six organizations and 35 recorded decisions.
  body: >-
    Seattle DSA, Tech 4 Housing, Tech 4 Taxes, Washington for Peace and Justice, WashingtonCAN, and
    Seattle Gay News joined the guide. Recorded decisions increased from 486 to 521. Their endorsements
    affected 21 races, including new ties in LD37 House Position 1 and Supreme Court Position 3. Eligibility
    and coverage counts changed across all 32 races. Co-endorsements retain their split points; no
    previous source was removed.
  provenance:
  - label: Primary sources
    url: /e/wa-2026-primary/sources/
