  actions: [added]
- corrected_on: 2026-07-21
  slug: website-launch-and-additional-decisions
  headline: Opened the website with 312 additional recorded decisions.
  body: >-
    The first live website expanded the downloadable guide's 174 decisions to 486, representing 35
    organizations rather than 17. The additions include Sierra Club, Washington Stonewall Democrats,
    and Seattle Times comparison decisions. Legislative-district organizations now count on the broader
    Seattle-ballot races they explicitly endorse, while counting only on their own district's legislative
    races. Counts, shares, or comparison evidence changed across all 32 races. The linked audit lists
    every addition and changed evidence link.
  provenance:
