      https://github.com/shaug/seattle-election-guide/blob/2026-general.10/docs/UPDATES_HISTORY_AUDIT_2026-10-16.md#primary-page-changes
  topics: [endorsements, results]
  actions: [correction]
- corrected_on: 2026-09-13
  slug: certified-results-complete
  headline: Completed certified results for all 32 races.
  body: >-
    Washington Secretary of State totals filled the eight remaining races: Congressional District
    9, LD32 Senate and both House positions, and Supreme Court Positions 1, 3, 5, and 7. The original
    24 King County results are retained. Each race links to its own counting authority; statewide
    totals are labeled votes counted. The change was prepared in August but did not reach the website
    until September 13.
  provenance:
  - label: Primary guide
    url: /e/wa-2026-primary/
  - label: Statewide results and per-race evidence
    url: https://github.com/shaug/seattle-election-guide/pull/419
