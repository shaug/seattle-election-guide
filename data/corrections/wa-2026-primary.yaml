  slug: comparison-rounding-and-selection-links
  headline: Corrected comparison rounding and selection-link failures.
  body: >-
    Comparison percentages stopped changing after interaction because of different rounding rules:
    a 9-of-16 share now stayed 56.2%. Failed source-selection links also received visible explanations
    instead of silently losing the selection.
  provenance:
